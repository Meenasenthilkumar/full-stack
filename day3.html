<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>cal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .calculator {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
      width: 300px;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    input {
      padding: 10px;
      margin: 5px;
      width: 120px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 15px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: teal;
      color: white;
      transition: background 0.3s;
    }
    button:hover {
      background: darkcyan;
    }
    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
      color: darkblue;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>Calculator</h1>
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number"><br>

    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>

    <div id="result">Result: </div>
  </div>

  <script>
    function add() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      document.getElementById("result").textContent = "Result: " + (n1 + n2);
    }

    function subtract() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      document.getElementById("result").textContent = "Result: " + (n1 - n2);
    }

    function multiply() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      document.getElementById("result").textContent = "Result: " + (n1 * n2);
    }

    function divide() {
      const n1 = parseFloat(document.getElementById("num1").value);
      const n2 = parseFloat(document.getElementById("num2").value);
      if (n2 === 0) {
        document.getElementById("result").textContent = "Result: Cannot divide by zero!";
      } else {
        document.getElementById("result").textContent = "Result: " + (n1 / n2);
      }
    }
  </script>
</body>
</html>
